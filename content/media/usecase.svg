<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1300" role="img" aria-labelledby="t d">
  <title id="t">SafeProof use case diagram</title>
  <desc id="d">Use case diagram in plain language. The reporter, who proves their report, signs up once, hides the accused's name, keeps their evidence private, reports anonymously and can accept or decline an invitation. An identity checker confirms each reporter is a real person, and the institution with advocates sets how many reports are needed. Zero-knowledge proofs publish and verify each report proof. The smart contract blocks double reports, counts distinct reporters and runs the consent policy check. Key management generates and manages keys and blinds names with a secret key. HR or an NGO, the verifier, sees only the count, invites reporters and starts an investigation only with their consent.</desc>
