<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 600" role="img" aria-labelledby="t d">
  <title id="t">SafeProof at a glance</title>
  <desc id="d">Four anonymous reporters, each in a different context, file reports against one blinded target tag. The ledger stores only nullifiers, commitments and coarse times, and rejects a duplicate nullifier. A zero-knowledge threshold proof tells the intermediary only that at least k distinct people reported.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6b2c6e"/>
    </marker>
    <marker id="arrMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#b8a6bb"/>
    </marker>
    <symbol id="person" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="19" fill="#f3e8f4" stroke="#6b2c6e" stroke-width="2"/>
      <circle cx="20" cy="15" r="6" fill="#6b2c6e"/>
      <path d="M9 32c1.5-6 6-9 11-9s9.5 3 11 9" fill="#6b2c6e"/>
    </symbol>
  </defs>

  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    text:not([fill]) { fill: #241d2a; }
    .h { font-size: 20px; font-weight: 700; }
    .s { font-size: 15px; fill: #665f6b; }
    .m { font-family: Consolas, Menlo, "Courier New", monospace; font-size: 15px; }
    .cap { font-size: 13px; font-weight: 700; letter-spacing: .08em; fill: #6b2c6e; }
  </style>

  <!-- column captions -->
  <text class="cap" x="40" y="38">REPORTERS · ANONYMOUS</text>
  <text class="cap" x="400" y="38">TAMPER-EVIDENT LEDGER</text>
  <text class="cap" x="920" y="38">WHAT THE INTERMEDIARY LEARNS</text>

  <!-- reporters -->
  <g>
    <rect x="40" y="60" width="270" height="84" rx="14" fill="#fff" stroke="#d9c3dc" stroke-width="2"/>
    <use href="#person" x="56" y="82" width="40" height="40"/>
    <text class="h" x="110" y="96">Reporter</text>
    <text class="s" x="110" y="120">via work Slack</text>

    <rect x="40" y="164" width="270" height="84" rx="14" fill="#fff" stroke="#d9c3dc" stroke-width="2"/>
    <use href="#person" x="56" y="186" width="40" height="40"/>
    <text class="h" x="110" y="200">Reporter</text>
    <text class="s" x="110" y="224">via conference badge</text>

    <rect x="40" y="268" width="270" height="84" rx="14" fill="#fff" stroke="#d9c3dc" stroke-width="2"/>
    <use href="#person" x="56" y="290" width="40" height="40"/>
    <text class="h" x="110" y="304">Reporter</text>
    <text class="s" x="110" y="328">via X account</text>

    <rect x="40" y="372" width="270" height="84" rx="14" fill="#fff" stroke="#d9c3dc" stroke-width="2"/>
    <use href="#person" x="56" y="394" width="40" height="40"/>
    <text class="h" x="110" y="408">Reporter</text>
    <text class="s" x="110" y="432">via Discord server</text>
  </g>

  <!-- reporter -> ledger arrows -->
  <g stroke="#6b2c6e" stroke-width="2.2" fill="none" marker-end="url(#arr)">
    <path d="M310 102 C350 102 350 180 396 180"/>
    <path d="M310 206 C350 206 350 222 396 222"/>
    <path d="M310 310 C350 310 350 264 396 264"/>
    <path d="M310 414 C350 414 350 306 396 306"/>
  </g>
  <path d="M310 110 C360 120 360 362 396 362" stroke="#b8a6bb" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#arrMuted)"/>

  <!-- ledger -->
  <rect x="400" y="60" width="420" height="396" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text class="h" x="424" y="96">tag = OPRF(identifier)</text>
  <text class="s" x="424" y="120">accused identifier stays blinded</text>
  <g>
    <text class="s" x="424" y="146" font-weight="700">nullifier</text>
    <text class="s" x="560" y="146" font-weight="700">commitment</text>
    <text class="s" x="720" y="146" font-weight="700">time</text>
    <line x1="424" y1="154" x2="796" y2="154" stroke="#86efac" stroke-width="1.5"/>
  </g>
  <g>
    <text class="m" x="424" y="186">3fa9…</text><text class="m" x="560" y="186">91d0…</text><text class="m" x="720" y="186">2026-03</text>
    <text class="m" x="424" y="228">b27e…</text><text class="m" x="560" y="228">44af…</text><text class="m" x="720" y="228">2026-05</text>
    <text class="m" x="424" y="270">e801…</text><text class="m" x="560" y="270">d3c2…</text><text class="m" x="720" y="270">2026-06</text>
    <text class="m" x="424" y="312">5c4d…</text><text class="m" x="560" y="312">07be…</text><text class="m" x="720" y="312">2026-08</text>
  </g>
  <g>
    <rect x="416" y="340" width="388" height="40" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
    <text class="m" x="424" y="366" fill="#b91c1c" text-decoration="line-through">3fa9…</text>
    <text class="s" x="500" y="366" style="fill:#b91c1c">duplicate nullifier: rejected</text>
  </g>
  <text class="s" x="424" y="412">Evidence never leaves the device.</text>
  <text class="s" x="424" y="434">The ledger holds salted commitments only.</text>

  <!-- ledger -> proof -->
  <path d="M820 258 L912 258" stroke="#6b2c6e" stroke-width="2.4" fill="none" marker-end="url(#arr)"/>
  <text class="s" x="866" y="244" text-anchor="middle">ZK proof</text>

  <!-- result card -->
  <rect x="916" y="60" width="344" height="396" rx="16" fill="#6b2c6e"/>
  <text x="944" y="112" font-size="18" fill="#f3e8f4">Threshold proof verified</text>
  <text x="944" y="196" font-size="84" font-weight="700" fill="#fff">≥ 4</text>
  <text x="944" y="236" font-size="22" font-weight="700" fill="#fff">distinct, registered</text>
  <text x="944" y="264" font-size="22" font-weight="700" fill="#fff">people reported</text>
  <text x="944" y="292" font-size="22" font-weight="700" fill="#fff">this one target.</text>
  <line x1="944" y1="318" x2="1232" y2="318" stroke="#a877ab" stroke-width="1.5"/>
  <text x="944" y="350" font-size="16" fill="#f3e8f4">Not revealed: names, accounts,</text>
  <text x="944" y="374" font-size="16" fill="#f3e8f4">evidence, or which report is whose.</text>
  <text x="944" y="418" font-size="16" fill="#fff" font-weight="700">Next: a consent-based invitation</text>
  <text x="944" y="440" font-size="16" fill="#fff" font-weight="700">to come forward.</text>

  <!-- principles strip -->
  <g>
    <rect x="40" y="500" width="390" height="64" rx="32" fill="#f3e8f4"/>
    <text x="235" y="539" text-anchor="middle" font-size="17" font-weight="600" fill="#6b2c6e">Evidence stays on the device</text>
    <rect x="455" y="500" width="390" height="64" rx="32" fill="#f3e8f4"/>
    <text x="650" y="539" text-anchor="middle" font-size="17" font-weight="600" fill="#6b2c6e">One report per person per target</text>
    <rect x="870" y="500" width="390" height="64" rx="32" fill="#f3e8f4"/>
    <text x="1065" y="539" text-anchor="middle" font-size="17" font-weight="600" fill="#6b2c6e">Only the count is revealed</text>
  </g>
</svg>
